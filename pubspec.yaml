name: darkwood
description: "Darkwood Coffee — a premium artisan coffee store with Apple Pay & Google Pay."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  pay: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Causten
      fonts:
        - asset: assets/fonts/Thin.ttf
          weight: 100
        - asset: assets/fonts/ThinOblique.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/ExtraLightOblique.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Light.ttf
          weight: 300
        - asset: assets/fonts/LightOblique.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Regular.ttf
          weight: 400
        - asset: assets/fonts/RegularOblique.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Medium.ttf
          weight: 500
        - asset: assets/fonts/MediumOblique.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SemiBoldOblique.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Bold.ttf
          weight: 700
        - asset: assets/fonts/BoldOblique.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/ExtraBoldOblique.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Black.ttf
          weight: 900
        - asset: assets/fonts/BlackOblique.ttf
          weight: 900
          style: italic
